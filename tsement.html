<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />
    <title>BASH EMIR - White Cement / Белый цемент</title>
    <link rel="icon" type="image/png" sizes="32x32" href="assets/photos/favicon.png?v=1.0" />
    <link rel="icon" type="image/png" sizes="16x16" href="assets/photos/favicon.png?v=1.0" />
    <link rel="shortcut icon" type="image/png" href="assets/photos/favicon.png?v=1.0" />
    <link rel="apple-touch-icon" href="assets/photos/favicon.png" />
    <link rel="stylesheet" href="style.css" />
    <style>
      body {
        background-color: #0d1419;
        color: #ffffff;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
      }
      .container-diesel {
        max-width: 800px;
        width: 100%;
        text-align: center;
        background: rgba(255, 255, 255, 0.05);
        padding: 40px;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(255, 215, 0, 0.1);
        box-sizing: border-box;
      }
      h1 {
        color: #ffd700;
        margin-bottom: 20px;
        font-size: 2.5rem;
      }
      .gallery {
        position: relative;
        margin-bottom: 20px;
        user-select: none;
        touch-action: pan-y;
      }
      .gallery-viewport {
        overflow: hidden;
        border-radius: 10px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
      }
      .gallery-track {
        display: flex;
        transition: transform 0.35s ease;
        will-change: transform;
      }
      .gallery-track.dragging {
        transition: none;
      }
      .gallery-slide {
        flex: 0 0 100%;
        min-width: 100%;
      }
      .gallery-slide img {
        display: block;
        width: 100%;
        height: auto;
        pointer-events: none;
      }
      .gallery-nav {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        background: rgba(13, 20, 25, 0.7);
        color: #ffd700;
        border: 1px solid rgba(255, 215, 0, 0.4);
        width: 40px;
        height: 40px;
        border-radius: 50%;
        cursor: pointer;
        font-size: 1.4rem;
        line-height: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.2s ease;
        z-index: 2;
      }
      .gallery-nav:hover {
        background: rgba(255, 215, 0, 0.2);
      }
      .gallery-nav.prev {
        left: 10px;
      }
      .gallery-nav.next {
        right: 10px;
      }
      .gallery-dots {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-top: 16px;
      }
      .gallery-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        border: none;
        padding: 0;
        background: rgba(255, 255, 255, 0.3);
        cursor: pointer;
        transition: background 0.2s ease, transform 0.2s ease;
      }
      .gallery-dot.active {
        background: #ffd700;
        transform: scale(1.15);
      }
      .btn-pdf {
        display: inline-block;
        background: #ffd700;
        color: #0d1419;
        padding: 15px 30px;
        text-decoration: none;
        border-radius: 5px;
        font-weight: bold;
        transition: all 0.3s ease;
        margin-top: 20px;
        border: none;
        cursor: pointer;
        font-family: inherit;
        font-size: 1rem;
      }
      .btn-pdf:hover {
        background: #ffffff;
        transform: translateY(-2px);
      }
      .back-link {
        display: block;
        margin-top: 30px;
        color: rgba(255, 255, 255, 0.6);
        text-decoration: none;
        font-size: 0.9rem;
      }
      .back-link:hover {
        color: #ffd700;
      }
      .spec-modal {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.85);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
        z-index: 1000;
        box-sizing: border-box;
      }
      .spec-modal.open {
        display: flex;
      }
      .spec-modal-content {
        position: relative;
        max-width: 900px;
        width: 100%;
        max-height: 90vh;
        overflow: auto;
      }
      .spec-modal-content img {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 10px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      }
      .spec-modal-close {
        position: absolute;
        top: -12px;
        right: -12px;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: none;
        background: #ffd700;
        color: #0d1419;
        font-size: 1.4rem;
        line-height: 1;
        cursor: pointer;
        font-weight: bold;
      }

      @media (max-width: 768px) {
        .container-diesel {
          padding: 30px 20px;
        }
        h1 {
          font-size: 1.8rem;
        }
        .btn-pdf {
          width: 100%;
          box-sizing: border-box;
          padding: 12px 20px;
        }
        .gallery-nav {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="container-diesel">
      <h1 data-translate="prod_white_cement">Белый цемент</h1>

      <div class="gallery" id="gallery">
        <div class="gallery-viewport">
          <div class="gallery-track" id="galleryTrack">
            <div class="gallery-slide">
              <img src="assets/photos/tsement1.jpg" alt="Белый цемент" />
            </div>
            <div class="gallery-slide">
              <img src="assets/photos/tsement2.jpg" alt="Белый цемент" />
            </div>
            <div class="gallery-slide">
              <img src="assets/photos/tsement3.jpg" alt="Белый цемент" />
            </div>
          </div>
        </div>
        <button type="button" class="gallery-nav prev" id="galleryPrev" aria-label="Previous">‹</button>
        <button type="button" class="gallery-nav next" id="galleryNext" aria-label="Next">›</button>
        <div class="gallery-dots" id="galleryDots"></div>
      </div>

      <p
        style="
          font-size: 1.1rem;
          line-height: 1.6;
          margin-bottom: 30px;
          opacity: 0.8;
          text-align: left;
        "
        data-translate="white_cement_page_desc"
      >
        Белый цемент — специальный вид цемента с высокой белизной,
        применяемый в декоративном строительстве, производстве архитектурного
        бетона, фасадных плиток, мраморной крошки и других отделочных материалов.
      </p>

      <button type="button" class="btn-pdf" id="openSpecBtn" data-translate="btn_open_spec">
        Открыть спецификацию
      </button>

      <a href="./" class="back-link" data-translate="btn_back_catalog"
        >← Вернуться в каталог</a
      >
    </div>

    <div class="spec-modal" id="specModal" role="dialog" aria-modal="true">
      <div class="spec-modal-content">
        <button type="button" class="spec-modal-close" id="closeSpecBtn" aria-label="Close">×</button>
        <img src="assets/photos/tsement-analiz.jpg" alt="Спецификация белого цемента" />
      </div>
    </div>

    <script src="lang.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const savedLang = getSavedLanguage();
        applyTranslations(savedLang);

        const track = document.getElementById("galleryTrack");
        const dotsContainer = document.getElementById("galleryDots");
        const slides = track.querySelectorAll(".gallery-slide");
        const total = slides.length;
        let index = 0;
        let startX = 0;
        let currentX = 0;
        let isDragging = false;

        slides.forEach((_, i) => {
          const dot = document.createElement("button");
          dot.type = "button";
          dot.className = "gallery-dot" + (i === 0 ? " active" : "");
          dot.setAttribute("aria-label", "Slide " + (i + 1));
          dot.addEventListener("click", () => goTo(i));
          dotsContainer.appendChild(dot);
        });

        const dots = dotsContainer.querySelectorAll(".gallery-dot");

        function updateGallery(animate = true) {
          track.classList.toggle("dragging", !animate);
          track.style.transform = "translateX(-" + index * 100 + "%)";
          dots.forEach((dot, i) => dot.classList.toggle("active", i === index));
        }

        function goTo(i) {
          index = (i + total) % total;
          updateGallery();
        }

        document.getElementById("galleryPrev").addEventListener("click", () => goTo(index - 1));
        document.getElementById("galleryNext").addEventListener("click", () => goTo(index + 1));

        function onDragStart(clientX) {
          isDragging = true;
          startX = clientX;
          currentX = clientX;
          track.classList.add("dragging");
        }

        function onDragMove(clientX) {
          if (!isDragging) return;
          currentX = clientX;
          const delta = currentX - startX;
          const offset = -index * 100 + (delta / track.offsetWidth) * 100;
          track.style.transform = "translateX(" + offset + "%)";
        }

        function onDragEnd() {
          if (!isDragging) return;
          isDragging = false;
          const delta = currentX - startX;
          const threshold = track.offsetWidth * 0.15;
          if (delta < -threshold) goTo(index + 1);
          else if (delta > threshold) goTo(index - 1);
          else updateGallery();
        }

        track.addEventListener("touchstart", (e) => onDragStart(e.touches[0].clientX), { passive: true });
        track.addEventListener("touchmove", (e) => onDragMove(e.touches[0].clientX), { passive: true });
        track.addEventListener("touchend", onDragEnd);

        track.addEventListener("mousedown", (e) => {
          e.preventDefault();
          onDragStart(e.clientX);
        });
        window.addEventListener("mousemove", (e) => {
          if (isDragging) onDragMove(e.clientX);
        });
        window.addEventListener("mouseup", onDragEnd);

        const specModal = document.getElementById("specModal");
        document.getElementById("openSpecBtn").addEventListener("click", () => {
          specModal.classList.add("open");
        });
        document.getElementById("closeSpecBtn").addEventListener("click", () => {
          specModal.classList.remove("open");
        });
        specModal.addEventListener("click", (e) => {
          if (e.target === specModal) specModal.classList.remove("open");
        });
        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape") specModal.classList.remove("open");
        });
      });
    </script>
    <style>
      .lang-btn.active {
        background: #ffd700 !important;
        color: #000 !important;
        opacity: 1 !important;
      }
    </style>
  </body>
</html>
