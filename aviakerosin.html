<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />
    <title>BASH EMIR - Aviation Kerosene TS-1</title>
    <link rel="icon" type="image/png" sizes="32x32" href="assets/photos/favicon.png?v=1.0" />
    <link rel="icon" type="image/png" sizes="16x16" href="assets/photos/favicon.png?v=1.0" />
    <link rel="shortcut icon" type="image/png" href="assets/photos/favicon.png?v=1.0" />
    <link rel="apple-touch-icon" href="assets/photos/favicon.png" />
    <link rel="stylesheet" href="style.css" />
    <style>
      body {
        background-color: #0d1419;
        color: #ffffff;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
      }
      .container-aviakerosin {
        max-width: 800px;
        width: 100%;
        text-align: center;
        background: rgba(255, 255, 255, 0.05);
        padding: 40px;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(255, 215, 0, 0.1);
        box-sizing: border-box;
      }
      .aviakerosin-img {
        max-width: 100%;
        height: auto;
        border-radius: 10px;
        margin-bottom: 30px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
      }
      h1 {
        color: #ffd700;
        margin-bottom: 20px;
        font-size: 2.5rem;
      }
      .back-link {
        display: block;
        margin-top: 30px;
        color: rgba(255, 255, 255, 0.6);
        text-decoration: none;
        font-size: 0.9rem;
      }
      .back-link:hover {
        color: #ffd700;
      }

      @media (max-width: 768px) {
        .container-aviakerosin {
          padding: 30px 20px;
        }
        h1 {
          font-size: 1.8rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="container-aviakerosin">
      <h1 data-translate="prod_aviation_kerosene_ts1">Авиационный керосин ТС-1</h1>
      <img
        src="assets/photos/aviakerosin.jpg"
        alt="Авиационный керосин ТС-1"
        class="aviakerosin-img"
      />
      <p
        style="
          font-size: 1.1rem;
          line-height: 1.6;
          margin-bottom: 30px;
          opacity: 0.8;
        "
        data-translate="aviation_kerosene_page_desc"
      >
        Авиационный керосин марки ТС-1 — это высококачественное топливо, предназначенное для использования в газотурбинных двигателях самолетов. Обладает отличными эксплуатационными характеристиками, высокой чистотой и стабильностью при хранении.
      </p>
      <a href="./" class="back-link" data-translate="btn_back_catalog"
        >← Вернуться в каталог</a
      >
    </div>
    <script src="lang.js"></script>
