<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />
    <title>BASH EMIR - РљРѕРјР±РёРЅР°С‚ В«Р“СѓРІР»С‹РґСѓР·В»</title>
    <link rel="icon" type="image/png" sizes="32x32" href="assets/photos/favicon.png?v=1.0" />
    <link rel="icon" type="image/png" sizes="16x16" href="assets/photos/favicon.png?v=1.0" />
    <link rel="shortcut icon" type="image/png" href="assets/photos/favicon.png?v=1.0" />
    <link rel="apple-touch-icon" href="assets/photos/favicon.png" />
    <link rel="stylesheet" href="style.css" />
    <style>
      :root {
        --primary-color: #1a2a3a;
        --accent-color: #ffd700;
        --bg-primary: #0d1419;
      }
      body {
        background-color: var(--bg-primary);
        background-image: radial-gradient(
          rgba(255, 215, 0, 0.05) 1px,
          transparent 1px
        );
        background-size: 30px 30px;
        color: #ffffff;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        padding: 0;
        line-height: 1.6;
      }
      .factory-header {
        background: rgba(16, 24, 32, 0.8);
        padding: 30px 0;
        backdrop-filter: blur(10px);
        border-bottom: 1px solid rgba(255, 215, 0, 0.2);
        position: sticky;
        top: 0;
        z-index: 100;
      }
      .breadcrumbs {
        max-width: 1100px;
        margin: 0 auto;
        padding: 0 20px;
        font-size: 0.85rem;
        color: rgba(255, 255, 255, 0.5);
      }
      .breadcrumbs a {
        color: var(--accent-color);
        text-decoration: none;
        transition: opacity 0.3s;
      }
      .breadcrumbs a:hover {
        opacity: 0.8;
      }
      .sep {
        margin: 0 5px;
        color: rgba(255, 255, 255, 0.3);
      }
      .factory-content {
        max-width: 1100px;
        margin: 60px auto;
        padding: 0 20px;
      }
      .factory-title {
        color: #ffffff;
        font-size: 2.8rem;
        margin-bottom: 60px;
        text-align: center;
        font-weight: 700;
        letter-spacing: -0.5px;
      }
      .factory-main-block {
        display: grid;
        grid-template-columns: 1fr 1.2fr;
        gap: 40px;
        margin-bottom: 40px;
        align-items: start;
      }
      .factory-image-container {
        position: relative;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        border: 1px solid rgba(255, 215, 0, 0.1);
      }
      .factory-image {
        width: 100%;
        display: block;
        transition: transform 0.5s ease;
      }
      .factory-image:hover {
        transform: scale(1.05);
      }
      .factory-text,
      .factory-additional-text {
        font-size: 1.15rem;
        line-height: 1.8;
        color: rgba(255, 255, 255, 0.85);
        text-align: left;
      }
      .factory-text p,
      .factory-additional-text p {
        margin-bottom: 25px;
      }
      .factory-additional-text {
        margin-top: 20px;
      }
      @media (max-width: 900px) {
        .factory-main-block {
          grid-template-columns: 1fr;
        }
        .factory-title {
          font-size: 2rem;
        }
      }
      .back-link {
        display: inline-block;
        color: var(--accent-color);
        text-decoration: none;
        font-weight: 600;
        padding: 10px 20px;
        border: 1px solid var(--accent-color);
        border-radius: 8px;
        transition: all 0.3s ease;
      }
      .back-link:hover {
        background: var(--accent-color);
        color: #000;
      }
      .lang-switcher-fixed {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 1000;
        display: flex;
        gap: 10px;
        background: rgba(0, 0, 0, 0.5);
        padding: 10px;
        border-radius: 30px;
        backdrop-filter: blur(5px);
      }
      .lang-btn {
        background: none;
        border: none;
        color: #fff;
        cursor: pointer;
        padding: 5px 10px;
        font-weight: bold;
        opacity: 0.6;
      }
      .lang-btn.active {
        color: var(--accent-color);
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div class="lang-switcher-fixed">
      <button class="lang-btn" onclick="switchLanguage('ru')" data-lang="ru">
        RU
      </button>
      <button class="lang-btn" onclick="switchLanguage('en')" data-lang="en">
        EN
      </button>
      <button class="lang-btn" onclick="switchLanguage('tr')" data-lang="tr">
        TR
      </button>
    </div>

    <div class="factory-header">
      <div class="breadcrumbs">
        <a href="./" data-translate="home_breadcrumb">Р“Р»Р°РІРЅР°СЏ</a>
        <span class="sep"> > </span>
        <a href="./factories" data-translate="factoriesTitle">Р—Р°РІРѕРґС‹</a>
        <span class="sep"> > </span>
        <span data-translate="factoryGuvlyduz">РљРѕРјР±РёРЅР°С‚ В«Р“СѓРІР»С‹РґСѓР·В»</span>
      </div>
    </div>

    <div class="factory-content">
      <h1 class="factory-title" data-translate="factoryGuvlyduz">
        РљРѕРјР±РёРЅР°С‚ В«Р“СѓРІР»С‹РґСѓР·В»
      </h1>

      <div class="factory-main-block">
        <div class="factory-image-container">
          <img
            src="assets/photos/factory/kombinat-guvlyduz.jpg"
            alt="Guvlyduz"
            class="factory-image"
          />
        </div>
        <div class="factory-text">
          <div data-translate="desc_guvlyduz_long_p1">
            <!-- Part 1 next to image -->
          </div>
        </div>
      </div>

      <div class="factory-additional-text">
        <div data-translate="desc_guvlyduz_long_p2">
          <!-- Part 2 full width -->
        </div>
      </div>

      <div style="text-align: center; margin-top: 50px">
        <a
          href="./factories"
          class="back-link"
          data-translate="btn_back_factories"
          >в†ђ Р’РµСЂРЅСѓС‚СЊСЃСЏ Рє СЃРїРёСЃРєСѓ Р·Р°РІРѕРґРѕРІ</a
        >
      </div>
    </div>

    <script src="lang.js"></script>
  </body>
</html>
